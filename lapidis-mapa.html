<style>
:root {
  --stone-dark: #1a1612;
  --stone-mid: #2e2820;
  --stone-warm: #3d3328;
  --stone-tan: #8b7355;
  --stone-sand: #c4a882;
  --stone-cream: #f0e8dc;
  --accent-gold: #c9a84c;
  --text-muted: #9a8870;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--stone-dark); font-family:'DM Sans',sans-serif; color:var(--stone-cream); }

body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;

  opacity:0.35;
}

/* NAV */
nav {
  position:fixed; top:0; left:0; right:0; z-index:900;
  padding:16px 48px; display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(to bottom, rgba(26,22,18,0.98), rgba(26,22,18,0.75));
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(196,168,130,0.1);
  height:60px;
}
.logo { font-family:'Cormorant Garamond',serif; font-size:20px; letter-spacing:3px; color:var(--stone-cream); text-decoration:none; }
.logo span { color:var(--accent-gold); font-style:italic; }
.nav-center { position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px; }
.nav-title { font-family:'Cormorant Garamond',serif; font-size:17px; font-style:italic; color:var(--stone-sand); }
.nav-sep { width:1px; height:16px; background:rgba(196,168,130,0.2); }
.nav-sub { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--text-muted); }
.nav-links { display:flex; gap:22px; list-style:none; align-items:center; }
.nav-links a { font-size:10px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:var(--stone-sand); text-decoration:none; transition:color .3s; }
.nav-links a:hover, .nav-links a.active { color:var(--accent-gold); }
.nav-cta { background:var(--accent-gold)!important; color:var(--stone-dark)!important; padding:8px 20px; }

/* MAP */
#map-wrap {
  position:fixed; inset:0; top:60px;
  background:radial-gradient(ellipse 100% 80% at 50% 55%, #1c1710 0%, #13100c 50%, #0d0b08 100%);
}

#map-svg { width:100%; height:100%; display:block; }

.graticule { fill:none; stroke:rgba(196,168,130,0.05); stroke-width:0.5; }
.sphere { fill:#0d0b08; }
.country { fill:#221e16; stroke:rgba(196,168,130,0.12); stroke-width:0.4; transition:fill 0.25s; }
.country:hover { fill:#2e2818; }
.country-active { fill:#2a2318 !important; }

/* QUARRY MARKERS */
.q-outer-ring {
  fill:none; stroke-width:0.8;
  animation:outerPulse 3s ease-out infinite;
}
.q-mid-ring {
  fill:none; stroke-width:0.6;
  animation:outerPulse 3s ease-out infinite;
  animation-delay:0.5s;
}
.q-core { transition:r 0.25s ease; }
.q-group { cursor:pointer; }
/* hover handled in JS */

@keyframes outerPulse {
  0%   { transform:scale(1);   opacity:0.6; }
  100% { transform:scale(2.8); opacity:0; }
}

/* Tier color scheme */
.t1 .q-outer-ring, .t1 .q-mid-ring { stroke:#c9a84c; }
.t1 .q-core { fill:#c9a84c; filter:drop-shadow(0 0 3px rgba(201,168,76,0.7)); }
.t2 .q-outer-ring, .t2 .q-mid-ring { stroke:#a07840; }
.t2 .q-core { fill:#9a7238; }
.t3 .q-outer-ring, .t3 .q-mid-ring { stroke:#6a5530; }
.t3 .q-core { fill:#5a4828; }

/* TOOLTIP */
#tt {
  position:fixed; z-index:950; pointer-events:none;
  opacity:0; transition:opacity 0.15s; max-width:270px;
}
#tt.show { opacity:1; }
.tt-box {
  background:rgba(20,16,11,0.97);
  border:1px solid rgba(196,168,130,0.2);
  border-top:2px solid var(--accent-gold);
  padding:14px 18px;
  backdrop-filter:blur(20px);
}
.tt-cnt { font-size:8px; letter-spacing:4px; text-transform:uppercase; color:var(--accent-gold); margin-bottom:5px; }
.tt-name { font-family:'Cormorant Garamond',serif; font-size:17px; color:var(--stone-cream); line-height:1.2; margin-bottom:3px; }
.tt-mat { font-family:'Cormorant Garamond',serif; font-size:12px; font-style:italic; color:var(--stone-sand); margin-bottom:7px; }
.tt-line { height:1px; background:rgba(196,168,130,0.1); margin:7px 0; }
.tt-fl { font-size:8px; letter-spacing:2px; text-transform:uppercase; color:var(--text-muted); margin-bottom:3px; }
.tt-fv { font-size:11px; color:var(--stone-tan); line-height:1.5; }

/* SIDE PANEL */
#panel {
  position:fixed; right:0; top:60px; bottom:0; width:320px; z-index:800;
  background:rgba(16,13,10,0.95);
  border-left:1px solid rgba(196,168,130,0.1);

  transform:translateX(100%);

  overflow-y:auto;
}
#panel.open { transform:translateX(0); }
.p-close {
  position:absolute; top:14px; right:14px; width:34px; height:34px;

  font-size:14px; display:flex; align-items:center; justify-content:center; z-index:10;
  transition:all .25s;
}
.p-close:hover { background:var(--accent-gold); color:var(--stone-dark); }
.p-bar { height:3px; background:linear-gradient(90deg,var(--accent-gold),transparent); }
.p-head { padding:28px 28px 18px; border-bottom:1px solid rgba(196,168,130,0.07); }
.p-eye { font-size:8px; letter-spacing:4px; text-transform:uppercase; color:var(--accent-gold); margin-bottom:7px; }
.p-name { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; color:var(--stone-cream); line-height:1.1; margin-bottom:5px; }
.p-loc { font-size:11px; color:var(--text-muted); }
.p-body { padding:20px 28px; }
.pf { margin-bottom:14px; }
.pk { font-size:8px; letter-spacing:3px; text-transform:uppercase; color:var(--text-muted); margin-bottom:3px; }
.pv { font-size:13px; color:var(--stone-sand); line-height:1.5; }

.p-cta {

  text-decoration:none; transition:all .25s;

.p-cta:hover { border-color:var(--accent-gold); color:var(--accent-gold); }

#legend {

.fp {

g": 60.68, "fame": "Catedral San Isaac SP, Palacio de Invierno", "material": "Ural White", "tier": 2}, {"name": "Volga Blue (Golovinskoye)", "country": "Ucrania", "type": "Granito", "lat": 50.1, "lng": 28.65, "fame": "Exportación a Italia, Alemania, EEUU", "material": "Volga Blue", "tier": 2}, {"name": "Armenian Tuff Zone", "country": "Armenia", "type": "Toba volcánica", "lat": 40.18, "lng": 44.51, "fame": "Templo de Garni (s.I a.C.), Etchmiadzin UNESCO", "material": "Armenian Tuff", "tier": 2}, {"name": "Takaka Marble", "country": "Nueva Zelanda", "type": "Mármol", "lat": -40.85, "lng": 172.8, "fame": "Edificios históricos de Wellington y Auckland", "material": "Takaka Marble", "tier": 3}, {"name": "Aji Granite", "country": "Japón", "type": "Granito", "lat": 34.39, "lng": 134.12, "fame": "Linternas japonesas (toro), jardines Zen centenarios", "material": "Aji Granite", "tier": 2}, {"name": "Artigas Amethyst", "country": "Uruguay", "type": "Cuarzo", "lat": -30.4, "lng": -56.96, "fame": "Geodos únicos, coleccionismo, decoración retroiluminada", "material": "Amatista de Artigas", "tier": 3}];

const MAIN_TYPES = ['Mármol','Granito','Travertino','Caliza','Cuarcita'];
let activeFilter = 'todos';
let svg, projection, path, zoom;

const W = () => window.innerWidth;
const H = () => window.innerHeight - 60;

function initMap() {
  svg = d3.select('#map-svg')
    .attr('width', W())
    .attr('height', H());

  projection = d3.geoNaturalEarth1()
    .scale(Math.min(W() / 5.5, H() / 3.2))
    .translate([W() / 2, H() / 2 + 20]);

  path = d3.geoPath().projection(projection);

  zoom = d3.zoom()
    .scaleExtent([0.8, 12])
    .on('zoom', (e) => {
      g.attr('transform', e.transform);
      const k = e.transform.k;
      d3.selectAll('.q-group').each(function() {
        const base = +d3.select(this).attr('data-r');
        if (!base) return;
        const s = base / k;
        d3.select(this).select('.q-core').attr('r', s);
        d3.select(this).select('.q-outer-ring').attr('r', s);
      });
    });

  svg.call(zoom);

  const g = svg.append('g').attr('id','g-map');

  // Sphere (ocean)
  g.append('path')
    .datum({type:'Sphere'})
    .attr('class','sphere')
    .attr('d', path);

  // Graticule
  const grat = d3.geoGraticule()();
  g.append('path')
    .datum(grat)
    .attr('class','graticule')
    .attr('d', path);

  // Countries from TopoJSON
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      g.selectAll('.country')
        .data(countries.features)
        .join('path')
        .attr('class','country')
        .attr('d', path);

      renderMarkers(g);
    });
}

function renderMarkers(g) {
  g.selectAll('.q-group').remove();

  const visible = QUARRIES.filter(q => {
    if (activeFilter === 'todos') return true;
    if (activeFilter === 'otros') return !MAIN_TYPES.includes(q.type);
    return q.type === activeFilter;
  });

  document.getElementById('cnNum').innerHTML = visible.length + '<span>+</span>';
  document.getElementById('cnLbl').textContent =
    activeFilter === 'todos' ? 'Canteras icónicas' :
    activeFilter === 'otros' ? 'Canteras · Otros tipos' :
    'Canteras de ' + activeFilter;

  const markerG = g.append('g').attr('id','markers');

  visible.forEach((q, i) => {
    const coords = projection([q.lng, q.lat]);
    if (!coords) return;
    const [x, y] = coords;

    const r = q.tier === 1 ? 5.5 : q.tier === 2 ? 3.8 : 2.5;
    const delay = ((i * 1.1) % 3).toFixed(1) + 's';

    const grp = markerG.append('g')
      .attr('class', `q-group t${q.tier}`)
      .attr('transform', `translate(${x},${y})`)
      .attr('data-r', r);

    // Outer pulse
    grp.append('circle')
      .attr('class','q-outer-ring')
      .attr('r', r)
      .style('animation-delay', delay)
      .style('transform-origin', '0 0');

    // Core dot
    grp.append('circle')
      .attr('class','q-core')
      .attr('r', r);

    // Events
    grp.on('mouseover', function() {
      const k = d3.zoomTransform(svg.node()).k;
      const base = +d3.select(this).attr('data-r');
      d3.select(this).select('.q-core').attr('r', (base / k) * 1.6);
    })
    .on('mouseout', function() {
      const k = d3.zoomTransform(svg.node()).k;
      const base = +d3.select(this).attr('data-r');
      d3.select(this).select('.q-core').attr('r', base / k);
    });
    grp.on('mouseenter', (e) => {
      document.getElementById('ttC').textContent = q.country + '  ·  ' + q.type;
      document.getElementById('ttN').textContent = q.name;
      document.getElementById('ttM').textContent = q.material;
      document.getElementById('ttF').textContent = q.fame;
      document.getElementById('tt').classList.add('show');
    })
    .on('mousemove', (e) => {
      const tt = document.getElementById('tt');
      let tx = e.clientX + 18, ty = e.clientY - 12;
      if (tx + 280 > W()) tx = e.clientX - 290;
      if (ty + 160 > H() + 60) ty = e.clientY - 170;
      tt.style.left = tx + 'px';
      tt.style.top = ty + 'px';
    })
    .on('mouseleave', () => {
      document.getElementById('tt').classList.remove('show');
    })
    .on('click', () => openPanel(q));
  });
}

function openPanel(q) {
  const tLabel = q.tier === 1 ? '⭐ Patrimonio mundial' : q.tier === 2 ? '★ Alta relevancia' : '· Relevancia regional';
  document.getElementById('pEye').textContent = q.country + '  ·  ' + q.type;
  document.getElementById('pName').textContent = q.name;
  document.getElementById('pLoc').textContent = '📍 ' + q.country + ' · ' + q.lat.toFixed(2) + '°N, ' + q.lng.toFixed(2) + '°E';
  document.getElementById('pBody').innerHTML = `
    <div class="pf">
      <div class="pk">Material extraído</div>
      <div class="pv pv-em">${q.material}</div>
    </div>
    <div class="pf">
      <div class="pk">Tipo de roca</div>
      <div class="pv">${q.type}</div>
    </div>
    <div class="pf">
      <div class="pk">Relevancia histórica</div>
      <div class="pv" style="color:var(--accent-gold)">${tLabel}</div>
    </div>
    <div class="p-div"></div>
    <div class="p-fame">
      <div class="p-fame-l">Monumentos &amp; proyectos clave</div>
      <div class="p-fame-v">${q.fame}</div>
    </div>
    <div class="p-div"></div>
    <a href="lapidis-canteras.html" class="p-cta">Ver ficha completa en directorio →</a>
  `;
  document.getElementById('panel').classList.add('open');
}

document.getElementById('pClose').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
});

document.querySelectorAll('.fp').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.fp').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    activeFilter = b.dataset.f;
    const g = document.getElementById('g-map') ? d3.select('#g-map') : null;
    if (g) renderMarkers(g);
  });
});

window.addEventListener('resize', () => {
  d3.select('#map-svg').attr('width', W()).attr('height', H());
  projection.scale(Math.min(W() / 5.5, H() / 3.2)).translate([W() / 2, H() / 2 + 20]);
  d3.selectAll('.sphere,.graticule,.country').attr('d', path);
  const g = d3.select('#g-map');
  renderMarkers(g);
});

initMap();
</script>
</body>
